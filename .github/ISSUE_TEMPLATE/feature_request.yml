name: Feature request
description: Suggest a capability for Dimensions
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please skim the roadmap in `docs/DESIGN.md` — the request may already be planned, or may be deliberately out of scope.

        **Out of scope:** Dimensions never modifies mesh geometry. Mesh-line drawing, face cutting, Push/Pull, Offset, and similar geometry-authoring tools belong in a separate project and won't be added here.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow you're stuck on rather than the feature you have in mind — it often leads somewhere better.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The capability you'd like, and roughly how you'd expect it to work in the viewport.
    validations:
      required: true

  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: Does another tool do this well? CAD packages, SketchUp, MeasureIt-ARCH, and similar references are useful.

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How you handle this today, if at all.
